<!DOCTYPE html>
<html lang="fa" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2128">
<title>Amotek | HMI</title>
<link rel="icon" href="images/menu-icon-192.png">
<link rel="apple-touch-icon" href="images/menu-apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMOTEK-HMI">
<style>
:root{
  color-scheme:dark;
  --bg:#1b2128; --card:#252d36; --card-hover:#2d3742; --line:#37424e;
  --text:#eef3f6; --muted:#9fb3c0; --accent:#65c8e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f1f4f7; --card:#ffffff; --card-hover:#e8f4fa; --line:#d3dbe2;
    --text:#1b2128; --muted:#55687a; --accent:#0d8fb8;
  }
}
:root[data-theme="light"]{color-scheme:light;--bg:#f1f4f7;--card:#fff;--card-hover:#e8f4fa;--line:#d3dbe2;--text:#1b2128;--muted:#55687a;--accent:#0d8fb8}
:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding:24px 18px;
}
.logo-box{height:84px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;margin-bottom:4px}
.logo-box img{max-height:100%;max-width:82%;width:auto;height:auto;display:block}
.logo-box.dark{background:#1b2128}.logo-box.white{background:#fff}
.logo-box.lockup{gap:8px;direction:ltr;container-type:inline-size}.logo-box.lockup img{width:54%;max-width:54%;min-width:0;flex:0 1 auto}
.logo-box .tag{flex:0 0 auto;font-weight:800;font-size:clamp(12px,2.2vw,22px);font-size:clamp(12px,8.5cqw,26px);letter-spacing:.12em;color:#eb374b;line-height:1}
h1{margin:0;font-size:clamp(20px,4.6vw,28px);font-weight:800;text-align:center}
.sub{margin:-12px 0 0;color:var(--muted);font-size:clamp(14px,3.4vw,16px);text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;width:min(1000px,100%)}
a.card{
  display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px;
  min-height:120px;transition:background .15s,transform .1s,border-color .15s;
  -webkit-tap-highlight-color:transparent;
}
a.card:hover,a.card:focus-visible{background:var(--card-hover);border-color:var(--accent);outline:none}
a.card:active{transform:scale(.98)}
.card .name{font-size:20px;font-weight:800;color:var(--accent);direction:ltr;text-align:right}
.card .desc{font-size:15px;line-height:1.7;color:var(--muted)}
.card .go{margin-top:auto;font-size:14px;font-weight:700}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
#topbar{position:fixed;top:6px;left:6px;z-index:1500;display:flex;gap:8px;align-items:center;pointer-events:none}
#installBtn{display:none;pointer-events:auto;padding:6px 12px;font:700 13px Vazirmatn,Tahoma,sans-serif;border:0;border-radius:8px;background:#65c8e8;color:#10202a;cursor:pointer}
#iosHint{display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:4000;padding:10px 12px;border-radius:10px;background:rgba(30,37,44,.96);color:#f1f5f8;border:1px solid rgba(101,200,232,.6);font:13px Vazirmatn,Tahoma,sans-serif;direction:rtl;text-align:center}
@media (max-height:520px){body{padding:12px 14px;gap:12px}.sub{margin:-6px 0 0}.logo-box{height:56px;margin-bottom:0;padding:6px}a.card{min-height:0;padding:14px 16px;gap:6px}.card .desc{font-size:13px;line-height:1.5}h1{font-size:20px}}
</style>
</head>
<body>
<div id="topbar"><button id="installBtn" type="button">نصب برنامه</button></div>
<div id="iosHint"></div>
<h1>راهنمای تعاملی پنل HMI</h1>
<p class="sub">یکی از پنل‌ها را انتخاب کن</p>

<main class="cards">
  <a class="card" href="stacker-panel/index.html">
    <span class="logo-box dark"><img src="images/amotek-logo.png" alt="AMOTEK" width="300" height="52"></span>
    <span class="name">Stacker Panel</span>
    <span class="desc">راهنمای تعاملی پنل HMI استکر Amotek ST8B-2S</span>
    <span class="go">باز کردن ←</span>
  </a>
  <a class="card" href="hmi-panel/index.html">
    <span class="logo-box white"><img src="images/ccs-logo.png" alt="Cellulose Converting Solutions" width="200" height="101"></span>
    <span class="name">HMI Panel</span>
    <span class="desc">راهنمای تعاملی پنل HMI</span>
    <span class="go">باز کردن ←</span>
  </a>
  <a class="card" href="bager-panel/index.html">
    <span class="logo-box dark lockup"><img src="images/amotek-logo.png" alt="AMOTEK" width="300" height="52"><span class="tag">BAGER</span></span>
    <span class="name">Bager Panel</span>
    <span class="desc">راهنمای تعاملی پنل HMI بگر Amotek</span>
    <span class="go">باز کردن ←</span>
  </a>
</main>
<script>
(function () {
  var standalone = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone;
  /* برنامه‌ی نصب‌شده خودکار افقی می‌شود */
  try { if (standalone && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}

  /* سرویس‌ورکر منو (پنل‌ها داخل پوشه‌ی خودشان ثبت جدا دارند). ثبتِ قدیمیِ ریشه با فایل دیگر پاک می‌شود */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    var rootScope = new URL("./", location.href).href, swUrl = new URL("sw.js", location.href).href;
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.map(function (r) {
        var a = r.active || r.waiting || r.installing;
        if (r.scope === rootScope && a && a.scriptURL !== swUrl) return r.unregister();
      }));
    }).catch(function () {}).then(function () { return navigator.serviceWorker.register("sw.js"); }).catch(function () {});
  }

  /* دکمه‌ی نصب برنامه */
  var ib = document.getElementById("installBtn"), h = document.getElementById("iosHint"), ht = null, dp = null;
  if (standalone) return;
  function show() { ib.style.display = "inline-block"; }
  function msg(t) { h.textContent = t; h.style.display = "block"; clearTimeout(ht); ht = setTimeout(function () { h.style.display = "none"; }, 9000); }
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); dp = e; show(); });
  addEventListener("appinstalled", function () { ib.style.display = "none"; });
  setTimeout(show, 2500);   /* اگر مرورگر پیام نصب نفرستاد، دکمه باز هم دیده می‌شود و راهنما می‌دهد */
  ib.addEventListener("click", function () {
    if (dp) { dp.prompt(); dp = null; ib.style.display = "none"; return; }
    msg(ios ? "برای نصب: دکمه Share را بزن و «Add to Home Screen» را انتخاب کن." : "از منوی ⋮ بالای مرورگر Chrome گزینه «Install app» یا «Add to Home screen» را بزن.");
  });
  if (ios) msg("برای نصب: دکمه Share را بزن و «Add to Home Screen» را انتخاب کن.");
})();
</script>
</body>
</html>
